apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    service: web
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    service: web
  # PATCH 3: ClusterIP by default (upstream hard-codes LoadBalancer). `dig`
  # keeps this nil-safe when a caller overrides the whole `web` map.
  {{- if .Values.nodeport }}
  type: NodePort
  {{- else }}
  type: {{ dig "service" "type" "LoadBalancer" .Values.web }}
  {{- end }}
---
{{if .Values.ocCreateRoute}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: web
spec:
  to:
    kind: Service
    name: web
{{end}}