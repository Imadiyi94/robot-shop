apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch
  labels:
    service: dispatch
spec:
  replicas: 1
  selector:
    matchLabels:
      service: dispatch
  template:
    metadata:
      labels:
        service: dispatch
    spec:
      {{ if .Values.psp.enabled }}
      serviceAccountName: robot-shop
      {{ end }}
      containers:
      - name: dispatch
        image: {{ include "robot-shop.image" (dict "root" $ "name" "rs-dispatch") }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if .Values.instana.enabled }}
        env:
          # agent networking access
          - name: INSTANA_AGENT_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
        {{- end }}
        # PATCH 2: readiness probe (upstream has none).
        # PATCH 8: removed. dispatch is a RabbitMQ consumer only - it never
        # opens an HTTP listener, so a tcpSocket probe could never pass. Its
        # own log "Rabbit MQ ready true" is the real readiness signal and it
        # has no endpoint to probe, so readiness follows the container state.
        resources:
          limits:
            cpu: 200m
            memory: 100Mi
          requests:
            cpu: 100m
            memory: 50Mi
      restartPolicy: Always
      {{- with .Values.dispatch.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dispatch.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dispatch.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
