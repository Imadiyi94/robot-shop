# PATCH 3 - Ingress exposure.
# New file (upstream has no Ingress template). Reuses the shared ingress-nginx
# controller installed during Capstone 1; this chart never installs a controller.
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  labels:
    service: web
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
{{- end }}
