apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    service: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      service: mysql
  template:
    metadata:
      labels:
        service: mysql
    spec:
      {{ if .Values.psp.enabled }}
      serviceAccountName: robot-shop
      {{ end }}
      containers:
      - name: mysql
        image: {{ include "robot-shop.image" (dict "root" $ "name" "rs-mysql-db") }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        # PATCH 7: NET_ADMIN was added upstream "for Istio". It is not needed by
        # the application, and PSA `baseline` rejects any capability outside its
        # default set - so this block would fail admission on the target
        # namespace. Gated, default off.
        {{- if .Values.mysql.netAdmin }}
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        {{- end }}
        ports:
        - containerPort: 3306
        resources:
          limits:
            cpu: 200m
            memory: 1024Mi
          requests:
            cpu: 100m
            memory: 700Mi
      restartPolicy: Always
      {{- with .Values.mysql.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mysql.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mysql.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
