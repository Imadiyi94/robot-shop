# Phase 1 overlay for the vendored robot-shop chart.
#
# Purpose: dedicated namespace, Instana hard-off, ClusterIP + Ingress exposure
# through the shared ingress-nginx controller, continuous synthetic load, and
# every image pinned by digest (decision D7).
#
# Usage:
#   helm upgrade --install robot-shop helm/robot-shop \
#     --namespace robot-shop -f helm/robot-shop/values-phase1.yaml
#
# Digests resolved 2026-10-26; provenance in docs/IMAGE_PINS.md.

# PATCH 1 - no Instana agent, no EUM beacons.
instana:
  enabled: false

image:
  repo: robotshop
  version: latest
  pullPolicy: IfNotPresent
  # PATCH 6 - digest pins. Rendered as repo/name:latest@sha256:...
  digests:
    rs-web: "sha256:b3c20d4a22f2875397726d2184062360bb2ab9c8776beffca7c2e7b3652893bc"
    rs-catalogue: "sha256:d545747c1b97cd2e0f41221291cd2f66781bceabaab2cfd42a7be4b8c2f3ba62"
    rs-cart: "sha256:388349d5cb3ccc14a192c345bfd42596920737db35d6a03a27457f6682710a37"
    rs-payment: "sha256:774b52c6180d8f3273f77230d70ace9c45e1f8909e21e10a19ed83b1cec53bb3"
    rs-user: "sha256:ea509182c180d20340a9427d8320f35085effdb4ed77b15275022d17bdd1fcf7"
    rs-shipping: "sha256:89753ab489193286402c9486379da63c18a21d697b4fbd41246b68aacabfc6d3"
    rs-ratings: "sha256:4899c686c249464783663342620425dc8c75a5d59ca55c247cf6aec62a5fff1a"
    rs-dispatch: "sha256:de81f1d07b021f24c1cc66fef6aa27f9a5456f08b0c081dfb4cc71027ff67ead"
    rs-mongodb: "sha256:119b545823cdce33a1d6cee87fdfed1cef82e680824ad0b49603be4aeb4e821e"
    rs-mysql-db: "sha256:2355f9700d771f4326169d7d370ad1824d2d410876036f77342d9663d80f893b"
    rs-load: "sha256:4041f38cb4d4c0263246dc4ceec493c5cd88e3be32b3292bd4960a1bceb8bd0e"

# Never NodePort/LoadBalancer: the shared controller already owns 30080.
nodeport: false

# PATCH 3 - reach the storefront at http://robot-shop.local:30080
ingress:
  enabled: true
  className: nginx
  host: robot-shop.local
  path: /

# PATCH 4 - continuous traffic so Phase 2 dashboards have signal.
loadgen:
  enabled: true
  host: http://web:8080/
  clients: 15
  silent: true
  error: true

redis:
  storageClassName: standard
  # PATCH 6 - upstream hard-codes redis:4.0.6.
  image:
    repository: redis
    tag: "4.0.6"
    digest: "sha256:0e773022cd6572a5153e5013afced0f7191652d3cdf9b1c6785eb13f6b2974b1"

rabbitmq:
  # PATCH 6 - upstream hard-codes rabbitmq:3.7-management-alpine. This tag is
  # what makes the management API (port 15672) available for Phase 2 backlog.
  image:
    repository: rabbitmq
    tag: "3.7-management-alpine"
    digest: "sha256:e97f6bb68aab3f747f8a6f4dc52ed57401de91ca480a0be3a36e7476ac273169"

web:
  service:
    type: ClusterIP
